<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANCOME STORE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #fffafc;
            color: #4d3440;
        }

        header {
            padding: 12px 3%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #f1dce5;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            color: #c5487b;
            font-size: clamp(21px, 3vw, 28px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #60434f;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #d94d87;
        }

        .hero {
            width: 90%;
            max-width: 1400px;
            min-height: 500px;
            margin: 35px auto;
            padding: 45px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            background: linear-gradient(120deg, #fce5ed, #f8d3e1);
            border-radius: 30px;
        }

        .hero-text {
            flex: 1 1 50%;
            min-width: 0;
        }

        .small-text {
            color: #d24d82;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.6;
        }

        h2 {
            margin: 18px 0;
            font-size: clamp(38px, 5vw, 58px);
            line-height: 1.1;
            color: #702d4d;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.7;
            color: #705461;
        }

        .shop-button {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 32px;
            background: #d94d87;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .shop-button:hover {
            background: #b9366b;
            transform: translateY(-2px);
        }

        .hero-video {
            flex: 0 1 40%;
            min-width: 0;
            height: 400px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px #e7cbd6;
        }

        .hero-video video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        footer {
            padding: 25px 15px;
            margin-top: 50px;
            background: #702d4d;
            color: white;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .logout {
            display: inline-block;
            border: none;
            padding: 10px 22px;
            background: #c5487b;
            color: white;
            border-radius: 20px;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        .logout:hover {
            background: #a92f62;
            color: white;
        }

        @media (max-width: 900px) {
            header {
                justify-content: center;
                text-align: center;
                padding: 15px 4%;
            }

            nav {
                gap: 18px;
            }

            .hero {
                width: 92%;
                padding: 35px;
                gap: 25px;
            }

            .hero-video {
                flex-basis: 42%;
                height: 340px;
            }

            .hero p {
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 22px 15px;
            }

            header h1 {
                font-size: 25px;
                text-align: center;
                justify-content: center;
            }

            .logo {
                width: 42px;
                height: 42px;
            }

            nav {
                width: 100%;
                gap: 15px 20px;
            }

            nav a {
                font-size: 14px;
            }

            .logout {
                padding: 9px 18px;
            }

            .hero {
                width: 92%;
                min-height: auto;
                margin: 22px auto;
                padding: 30px 22px;
                flex-direction: column;
                align-items: stretch;
                gap: 30px;
                border-radius: 22px;
            }

            .hero-text {
                width: 100%;
            }

            .small-text {
                font-size: 12px;
                letter-spacing: 1.5px;
            }

            h2 {
                font-size: clamp(38px, 10vw, 48px);
                margin: 15px 0;
            }

            .hero p {
                font-size: 15px;
                line-height: 1.8;
            }

            .shop-button {
                padding: 13px 28px;
            }

            .hero-video {
                width: 100%;
                flex: none;
                height: auto;
                aspect-ratio: 4 / 5;
                border-radius: 20px;
            }

            .hero-video video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            footer {
                margin-top: 30px;
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            nav {
                gap: 14px;
            }

            nav a {
                font-size: 13px;
            }

            .hero {
                padding: 25px 18px;
            }

            .small-text {
                font-size: 11px;
            }

            h2 {
                font-size: 36px;
            }

            .hero-video {
                aspect-ratio: 3 / 4;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>
            <img src="logo.png" alt="LANCOME Logo" class="logo">
            LANCOME STORE
        </h1>

        <strong><nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Products</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="index.html" class="logout">Log out</a>
        </nav></strong>
    </header>

    <div class="hero">

        <div class="hero-text">
            <div class="small-text">
                BEAUTY &#183; CARE &#183; CONFIDENCE
            </div>

            <h2>
                Feel Beautiful.<br>
                Be You.
            </h2>

            <p>
                Discover beauty products made for your everyday
                routine. Simple, affordable, and made to help
                you feel confident.
            </p>

            <a class="shop-button" href="p.html">
                Shop Now
            </a>
        </div>

        <div class="hero-video">
            <video autoplay muted loop playsinline controls>
                <source src="com.mp4" type="video/mp4">
                Your browser does not support the video.
            </video>
        </div>

    </div>

    <footer>
        &copy; 2026 LANCOME Store | Beauty Made Simple
    </footer>

</body>
</html>
