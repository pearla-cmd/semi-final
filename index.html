<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANCÔME STORE</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: url("bg.png") center center / cover no-repeat;
            background-color: #e9b9c5;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 230, 237, 0.06);
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            padding: 34px 35px 30px;
            text-align: center;
            background: rgba(255, 241, 246, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 25px;
            backdrop-filter: blur(17px);
            -webkit-backdrop-filter: blur(17px);
            box-shadow:
                0 18px 45px rgba(100, 45, 65, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            animation: appear 0.8s ease;
        }

        .flower-logo {
            display: block;
            width: 165px;
            max-width: 80%;
            max-height: 150px;
            height: auto;
            margin: 0 auto 18px;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(100, 45, 65, 0.12));
            transition: transform 0.3s ease;
        }

        .flower-logo:hover {
            transform: scale(1.04);
        }

        .subtitle {
            margin: 0 0 27px;
            color: #fffafc;
            font-size: 11px;
            letter-spacing: 3px;
            text-shadow: 0 1px 5px rgba(100, 45, 65, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: -10px auto 26px;
        }

        .divider::before,
        .divider::after {
            content: "";
            width: 35px;
            height: 1px;
            background: #ffe4ed;
        }

        .divider span {
            width: 6px;
            height: 6px;
            background: #fff3f7;
            transform: rotate(45deg);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(100, 45, 65, 0.15);
        }

        .input-group input {
            display: block;
            width: 100%;
            min-width: 0;
            height: 49px;
            padding: 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 250, 252, 0.20);
            color: #ffffff;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 250, 252, 0.9);
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: rgba(255, 250, 252, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 220, 233, 0.2);
        }

        .show {
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            max-width: 100%;
            margin: 3px 0 23px;
            color: #ffffff;
            font-size: 12px;
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(100, 45, 65, 0.15);
        }

        .show input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #c04470;
            cursor: pointer;
            flex-shrink: 0;
        }

        button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 50px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            background: linear-gradient(120deg, #df82a5, #c44d7b 55%, #a62f5c);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(130, 45, 80, 0.18);
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(120deg, #e997b5, #d45d89 55%, #b83c69);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(130, 45, 80, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .footer {
            margin-top: 27px;
            color: #fff8fb;
            font-family: Georgia, serif;
            font-size: 10px;
            letter-spacing: 2px;
            line-height: 1.8;
            text-shadow: 0 1px 4px rgba(100, 45, 65, 0.15);
        }

        .footer span {
            display: block;
            margin-top: 5px;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
                background-position: center;
            }

            .login-box {
                max-width: 370px;
                padding: 29px 23px 26px;
                border-radius: 21px;
            }

            .flower-logo {
                width: 145px;
                max-height: 130px;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 2px;
                margin-bottom: 25px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
            }

            .login-box {
                margin: 10px auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-box {
                animation: none;
            }

            .flower-logo,
            button,
            .input-group input {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <img src="logo.png" alt="Lancôme Logo" class="flower-logo">

        <div class="subtitle">PARIS · BEAUTY · ELEGANCE</div>

        <div class="divider">
            <span></span>
        </div>

        <form onsubmit="login(event)">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <label class="show">
                <input type="checkbox" id="showPassword" onchange="togglePassword()">
                Show Password
            </label>

            <button type="submit">
                LOGIN <span aria-hidden="true">→</span>
            </button>

        </form>

        <div class="footer">
            DISCOVER YOUR BEAUTY
        </div>

    </main>

    <script>
        function login(event) {
            event.preventDefault();

            var username = document.getElementById("username").value.trim();
            var password = document.getElementById("password").value;

            if (username === "pearl" && password === "200628") {
                window.location.href = "home.html";
            } else {
                alert("Incorrect username or password. Please try again.");
            }
        }

        function togglePassword() {
            var password = document.getElementById("password");
            var checkbox = document.getElementById("showPassword");

            password.type = checkbox.checked ? "text" : "password";
        }
    </script>

</body>
</html>
